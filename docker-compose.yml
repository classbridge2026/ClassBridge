services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: classbridge
      POSTGRES_PASSWORD: classbridge
      POSTGRES_DB: classbridge
    ports:
      - "5432:5432"
    volumes:
      - classbridge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classbridge -d classbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://classbridge:classbridge@db:5432/classbridge?schema=public
      AUTH_SECRET: change-me-in-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  classbridge_pg:
